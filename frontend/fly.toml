# Fly.io configuration for QA Training Platform Frontend
# App name must match FRONTEND_URL in backend (https://qa-platform-frontend.fly.dev)
app = "qa-platform-frontend"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    VITE_API_URL = "https://qa-platform-backend.fly.dev"
    VITE_DEMO_MODE = "false"

[env]
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
