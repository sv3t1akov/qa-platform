[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    mission_health: Tests for lab availability
    mission_flags: Tests for flag retrieval
    slow: Slow running tests
filterwarnings =
    ignore::DeprecationWarning
