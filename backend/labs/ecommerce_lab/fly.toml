# fly.toml app configuration file generated for qa-lab-ecommerce on 2026-02-13T09:38:32+05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'qa-lab-ecommerce'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  DEBUG_MODE = 'false'
  MISSION_ID = 'ecommerce-lab'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '1m0s'
    method = 'GET'
    path = '/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
