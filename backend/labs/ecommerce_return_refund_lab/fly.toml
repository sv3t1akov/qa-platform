# Fly.io configuration - E-Commerce Return & Refund Lab
# See https://fly.io/docs/reference/configuration/

app = "qa-lab-ecom-return-refund"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  DEBUG_MODE = "false"
  ENV = "prod"
  FLAGS_SEED = "production_seed_2026"
  MISSION_ID = "ecom-return-refund"
  PLATFORM_SECRET = "platform-secret-key"

[processes]
  app = "uvicorn app.main:app --host 0.0.0.0 --port 8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  timeout = "10s"
  path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
