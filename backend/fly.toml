# Fly.io configuration for QA Platform Backend
app = "qa-platform-backend"
primary_region = "ams"

[build]

[env]
  FRONTEND_URL = "https://qa-platform-frontend.fly.dev"
  ECOM_LAB_URL = "https://qa-lab-ecom-return-refund.fly.dev"
  PLATFORM_SECRET = "platform-secret-key"
  DEBUG = "false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
